name: Changelog append

on:
  push:
    branches: [main]
    paths-ignore:
      - 'CHANGELOG.md'
      - 'wiki/**'
      - 'LICENSE'
      - 'NOTICE'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
  workflow_dispatch:
    inputs:
      range:
        description: 'Override commit range, for example abc123..def456.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: changelog-append
  cancel-in-progress: false

jobs:
  append:
    if: ${{ github.repository == 'RealWhyKnot/ParsecCouchLink' && (github.event_name == 'workflow_dispatch' || (github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip changelog]'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute range
        id: range
        shell: bash
        env:
          DISPATCH_RANGE: ${{ inputs.range }}
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ -n "$DISPATCH_RANGE" ]]; then
              range="$DISPATCH_RANGE"
            else
              range="HEAD~1..HEAD"
            fi
            echo "range=$range" >> "$GITHUB_OUTPUT"
            echo "Computed range: $range"
            exit 0
          fi

          before='${{ github.event.before }}'
          after='${{ github.event.after }}'
          if [[ "$before" =~ ^0+$ ]]; then
            range="HEAD~1..HEAD"
          elif git merge-base --is-ancestor "$before" "$after" 2>/dev/null; then
            range="$before..$after"
          else
            range="HEAD~1..HEAD"
          fi

          echo "range=$range" >> "$GITHUB_OUTPUT"
          echo "Computed range: $range"

      - name: Append commits
        id: append
        shell: pwsh
        run: |
          ./.github/scripts/Update-Changelog.ps1 -Mode Append -Range '${{ steps.range.outputs.range }}'

          $changed = & git status --porcelain CHANGELOG.md
          if ([string]::IsNullOrWhiteSpace($changed)) {
            "changed=false" >> $env:GITHUB_OUTPUT
            Write-Host "No changelog updates produced."
          } else {
            "changed=true" >> $env:GITHUB_OUTPUT
            & git --no-pager diff --stat CHANGELOG.md
          }

      - name: Commit changelog
        if: steps.append.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          short_sha="${GITHUB_SHA::7}"
          expected_oid=$(git rev-parse HEAD)
          changelog_b64=$(base64 -w 0 CHANGELOG.md)

          headline="docs(changelog): auto-append entries from ${short_sha} [skip changelog]"
          body="Updated by .github/workflows/changelog-append.yml."

          payload=$(jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg headline "$headline" \
            --arg body "$body" \
            --arg oid "$expected_oid" \
            --arg changelog "$changelog_b64" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid url } } }",
              variables: {
                input: {
                  branch: { repositoryNameWithOwner: $repo, branchName: $branch },
                  message: { headline: $headline, body: $body },
                  fileChanges: {
                    additions: [
                      { path: "CHANGELOG.md", contents: $changelog }
                    ]
                  },
                  expectedHeadOid: $oid
                }
              }
            }')

          response=$(printf '%s' "$payload" | gh api graphql --input -)
          echo "$response" | jq .
          if echo "$response" | jq -e '.errors // empty' >/dev/null; then
            echo "::error::createCommitOnBranch returned GraphQL errors"
            exit 1
          fi

          new_oid=$(echo "$response" | jq -r '.data.createCommitOnBranch.commit.oid')
          if [[ -z "$new_oid" || "$new_oid" == "null" ]]; then
            echo "::error::createCommitOnBranch did not return a commit oid"
            exit 1
          fi
          echo "Committed changelog update: $new_oid"
