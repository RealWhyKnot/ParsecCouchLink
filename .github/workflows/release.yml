name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version without leading v, such as 2026.5.15.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history + all tags so the release-body step can diff
          # commits against the previous version tag for the changelog.
          fetch-depth: 0

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bridge/target
          key: ${{ runner.os }}-bridge-${{ hashFiles('bridge/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-bridge-

      - name: Pico build cache
        uses: actions/cache@v5
        with:
          path: |
            pico-bridge/build-_pico_sdk
            pico-bridge/build-pico2w
            pico-bridge/build-picow
          key: ${{ runner.os }}-pico-${{ hashFiles('pico-bridge/CMakeLists.txt', 'pico-bridge/pico_sdk_import.cmake', 'pico-bridge/scripts/build.ps1', 'pico-bridge/src/**') }}
          restore-keys: |
            ${{ runner.os }}-pico-

      - name: Install Pico toolchain
        shell: pwsh
        run: |
          choco install ninja gcc-arm-embedded -y --no-progress

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'
            $tag = "v$version"
          } else {
            $tag = '${{ github.ref_name }}'
            $version = $tag.TrimStart('v')
          }
          if ($version -notmatch '^\d{4}\.\d+\.\d+\.\d+(-[A-Fa-f0-9]{4})?$') {
            throw "Invalid version '$version'. Expected YYYY.M.D.N or YYYY.M.D.N-XXXX."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Build release zip
        shell: pwsh
        run: ./build.ps1 -Version '${{ steps.version.outputs.version }}' -Package

      - name: Locate artifacts
        id: artifact
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/ParsecCouchLink-v*.zip | Select-Object -First 1
          if (-not $zip) { throw "No release zip found in dist/." }
          $manifest = Get-ChildItem dist/ParsecCouchLink-v*.manifest.tsv | Select-Object -First 1
          if (-not $manifest) { throw "No release manifest found in dist/." }
          $sha = (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToUpperInvariant()
          "zip=$($zip.FullName)" >> $env:GITHUB_OUTPUT
          "zip_name=$($zip.Name)" >> $env:GITHUB_OUTPUT
          "manifest=$($manifest.FullName)" >> $env:GITHUB_OUTPUT
          "sha256=$sha" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ParsecCouchLink-release
          path: |
            ${{ steps.artifact.outputs.zip }}
            ${{ steps.artifact.outputs.manifest }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
          ZIP_PATH: ${{ steps.artifact.outputs.zip }}
          ZIP_NAME: ${{ steps.artifact.outputs.zip_name }}
          ZIP_SHA256: ${{ steps.artifact.outputs.sha256 }}
          MANIFEST_PATH: ${{ steps.artifact.outputs.manifest }}
        shell: pwsh
        run: |
          # Build the release body. Top section is a conventional-commit
          # changelog grouped by type, extracted from `git log $prev..$tag`.
          # Bottom section is the static install instructions.

          $prevTag = git tag --list 'v*' --sort=-version:refname |
                     Where-Object { $_ -ne $env:TAG_NAME } |
                     Select-Object -First 1

          $sections = [ordered]@{
              feat     = 'Features'
              fix      = 'Bug Fixes'
              perf     = 'Performance'
              refactor = 'Refactors'
              docs     = 'Documentation'
              test     = 'Tests'
              ci       = 'CI'
              build    = 'Build'
              chore    = 'Chores'
              style    = 'Style'
              revert   = 'Reverts'
              other    = 'Other'
          }
          $groups = @{}
          $breaking = @()

          if ($prevTag) {
              $range = "$prevTag..$env:TAG_NAME"
              $logLines = git log $range --pretty=format:"%h%x09%s" --no-merges
              foreach ($line in $logLines) {
                  if ([string]::IsNullOrWhiteSpace($line)) { continue }
                  $parts = $line -split "`t", 2
                  $sha = $parts[0]
                  $subject = $parts[1]
                  if ($subject -match '^(?<type>\w+)(\((?<scope>[^)]+)\))?(?<bang>!)?:\s*(?<desc>.+)$') {
                      $type = $matches['type'].ToLowerInvariant()
                      $scope = $matches['scope']
                      $isBreaking = -not [string]::IsNullOrEmpty($matches['bang'])
                      $desc = $matches['desc']
                      if (-not $sections.Contains($type)) { $type = 'other' }
                      if ($scope) {
                          $entry = "- ``$sha`` **${scope}**: $desc"
                      } else {
                          $entry = "- ``$sha`` $desc"
                      }
                      if ($isBreaking) {
                          if ($scope) {
                              $breaking += "- ``$sha`` **${scope}**: $desc"
                          } else {
                              $breaking += "- ``$sha`` $desc"
                          }
                      }
                      if (-not $groups.ContainsKey($type)) { $groups[$type] = @() }
                      $groups[$type] += $entry
                  } else {
                      if (-not $groups.ContainsKey('other')) { $groups['other'] = @() }
                      $groups['other'] += "- ``$sha`` $subject"
                  }
              }
          }

          $out = New-Object System.Collections.Generic.List[string]
          if ($prevTag) {
              $out.Add("## Changes since $prevTag")
              $out.Add("")
              if ($breaking.Count -gt 0) {
                  $out.Add("### Breaking Changes")
                  $out.Add("")
                  foreach ($e in $breaking) { $out.Add($e) }
                  $out.Add("")
              }
              $emitted = $false
              foreach ($key in $sections.Keys) {
                  if ($groups.ContainsKey($key) -and $groups[$key].Count -gt 0) {
                      $emitted = $true
                      $out.Add("### $($sections[$key])")
                      $out.Add("")
                      foreach ($e in $groups[$key]) { $out.Add($e) }
                      $out.Add("")
                  }
              }
              if (-not $emitted) {
                  $out.Add("_No conventional-commit changes since $prevTag._")
                  $out.Add("")
              }
              $out.Add("**Full diff:** https://github.com/$env:GITHUB_REPOSITORY/compare/$prevTag...$env:TAG_NAME")
              $out.Add("")
          } else {
              $out.Add("Initial release.")
              $out.Add("")
          }

          $out.Add("## Install")
          $out.Add("")
          $out.Add("Download ``$env:ZIP_NAME``, extract the full zip, then run:")
          $out.Add("")
          $out.Add("    powershell -ExecutionPolicy Bypass -File .\setup.ps1")
          $out.Add("")
          $out.Add("SHA256: ``$env:ZIP_SHA256``")
          $out.Add("")
          $out.Add("Full walkthrough: https://github.com/$env:GITHUB_REPOSITORY/wiki/Quick-Start")

          $notes = $out -join "`n"
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding UTF8

          gh release create $env:TAG_NAME $env:ZIP_PATH $env:MANIFEST_PATH --title $env:TAG_NAME --notes-file $notesPath
