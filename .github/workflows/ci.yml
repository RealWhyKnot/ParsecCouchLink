name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'bridge/**'
      - 'pico-bridge/**'
      - 'scripts/**'
      - 'tools/**'
      - 'build.ps1'
      - 'setup.ps1'
      - '.clang-format'
      - '.editorconfig'
      - '.github/scripts/**'
      - '.github/workflows/**'
      - '.github/dependabot.yml'
      - '.githooks/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    permissions:
      contents: read
    uses: RealWhyKnot/workflows/.github/workflows/repo-checks.yml@v1

  changelog-guard:
    name: Reject changelog edits in pull requests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for CHANGELOG.md changes
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if git diff --name-only "$PR_BASE_SHA...$PR_HEAD_SHA" | grep -qx 'CHANGELOG.md'; then
            echo "::error::CHANGELOG.md is maintained by the release workflows. Drop the changelog edits from this pull request; entries for merged commits are appended automatically."
            exit 1
          fi
          echo "No CHANGELOG.md changes."

  bridge:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Rust toolchain
        uses: RealWhyKnot/workflows/setup-rust@v1
        with:
          working-directory: bridge
          cache-key: bridge

      - name: Lint Rust and scripts
        shell: pwsh
        run: ./tools/lint.ps1 -SkipFirmware

      - name: Rust tests
        run: cargo test --manifest-path bridge/Cargo.toml --locked

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ARM_GNU_VERSION: 13.2.rel1
      ARM_GNU_SHA256: 6cd1bbc1d9ae57312bcd169ae283153a9572bd6a8e4eeae2fedfbc33b115fdbb
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Pico build cache
        uses: actions/cache@v6
        with:
          path: |
            pico-bridge/build-_pico_sdk
            pico-bridge/build-pico2w
            pico-bridge/build-picow
          key: ${{ runner.os }}-pico-${{ hashFiles('pico-bridge/CMakeLists.txt', 'pico-bridge/pico_sdk_import.cmake', 'pico-bridge/scripts/build.ps1', 'pico-bridge/src/**') }}
          restore-keys: |
            ${{ runner.os }}-pico-

      - name: Arm toolchain cache
        id: arm-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/arm-gnu-toolchain
          key: ${{ runner.os }}-arm-gnu-toolchain-${{ env.ARM_GNU_VERSION }}

      - name: Install Pico toolchain
        env:
          CACHE_HIT: ${{ steps.arm-cache.outputs.cache-hit }}
        run: |
          dir="$RUNNER_TEMP/arm-gnu-toolchain"
          if [ "$CACHE_HIT" != "true" ]; then
            archive="arm-gnu-toolchain-$ARM_GNU_VERSION-x86_64-arm-none-eabi.tar.xz"
            curl -fsSL --retry 5 --retry-all-errors --connect-timeout 20 -o "$RUNNER_TEMP/$archive" "https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/$ARM_GNU_VERSION/binrel/$archive"
            echo "$ARM_GNU_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
            mkdir -p "$dir"
            tar -xJf "$RUNNER_TEMP/$archive" -C "$dir" --strip-components=1
            rm "$RUNNER_TEMP/$archive"
          fi
          echo "$dir/bin" >> "$GITHUB_PATH"
          echo "CLANG_FORMAT=clang-format-18" >> "$GITHUB_ENV"
          cmake --version | head -1
          ninja --version
          clang-format-18 --version
          "$dir/bin/arm-none-eabi-gcc" --version | head -1

      - name: Firmware formatting
        shell: pwsh
        run: ./tools/lint.ps1 -SkipRust -SkipPowerShell

      - name: Host unit tests (CDC framing)
        run: |
          cmake -S pico-bridge/tests -B build-host-tests
          cmake --build build-host-tests
          ctest --test-dir build-host-tests --output-on-failure

      - name: Build firmware (both boards)
        shell: pwsh
        run: ./pico-bridge/scripts/build.ps1 -Release

      - name: Verify both UF2s present
        shell: pwsh
        run: |
          $files = @(
            'pico-bridge/dist/couchlink-pico2w.uf2',
            'pico-bridge/dist/couchlink-picow.uf2'
          )
          foreach ($f in $files) {
            if (-not (Test-Path -LiteralPath $f)) { throw "Missing $f" }
            $size = (Get-Item -LiteralPath $f).Length
            Write-Host "$f -- $size bytes"
          }
