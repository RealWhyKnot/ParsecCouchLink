name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'bridge/**'
      - 'pico-bridge/**'
      - 'scripts/**'
      - 'build.ps1'
      - 'setup.ps1'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bridge/target
          key: ${{ runner.os }}-bridge-${{ hashFiles('bridge/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-bridge-

      - name: Rust format
        run: cargo fmt --manifest-path bridge/Cargo.toml -- --check

      - name: Rust clippy
        run: cargo clippy --manifest-path bridge/Cargo.toml --all-targets --locked -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path bridge/Cargo.toml --locked

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Pico build cache
        uses: actions/cache@v5
        with:
          path: |
            pico-bridge/build-_pico_sdk
            pico-bridge/build-pico2w
            pico-bridge/build-picow
          key: ${{ runner.os }}-pico-${{ hashFiles('pico-bridge/CMakeLists.txt', 'pico-bridge/pico_sdk_import.cmake', 'pico-bridge/scripts/build.ps1', 'pico-bridge/src/**') }}
          restore-keys: |
            ${{ runner.os }}-pico-

      - name: Install Pico toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Build firmware (both boards)
        shell: pwsh
        run: ./pico-bridge/scripts/build.ps1 -Release

      - name: Verify both UF2s present
        shell: pwsh
        run: |
          $files = @(
            'pico-bridge/dist/couchlink-pico2w.uf2',
            'pico-bridge/dist/couchlink-picow.uf2'
          )
          foreach ($f in $files) {
            if (-not (Test-Path -LiteralPath $f)) { throw "Missing $f" }
            $size = (Get-Item -LiteralPath $f).Length
            Write-Host "$f -- $size bytes"
          }
