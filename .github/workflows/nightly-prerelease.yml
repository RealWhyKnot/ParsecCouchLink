name: Nightly Prerelease

on:
  schedule:
    - cron: '45 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: nightly-prerelease
  cancel-in-progress: false

jobs:
  tag:
    if: github.repository == 'RealWhyKnot/ParsecCouchLink'
    uses: RealWhyKnot/workflows/.github/workflows/nightly-beta-scripted.yml@v1
    with:
      planner: ./.github/scripts/Get-NightlyPrereleasePlan.ps1
      validate-scripts: |
        ./.github/scripts/Test-NightlyPrereleasePlan.ps1
      ignore-paths: |
        pico-bridge/tests/**
      ci-workflow: ci.yml
