name: Nightly Prerelease

on:
  schedule:
    - cron: '45 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: nightly-prerelease
  cancel-in-progress: false

jobs:
  tag:
    name: Create prerelease when release inputs changed
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate planner
        shell: pwsh
        run: |
          ./.github/scripts/Test-WorkflowSyntax.ps1
          ./.github/scripts/Test-NightlyPrereleasePlan.ps1

      - name: Plan nightly prerelease
        id: plan
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --tags --force
          ./.github/scripts/Get-NightlyPrereleasePlan.ps1

      - name: Report no changes
        if: ${{ steps.plan.outputs.has_changes != 'true' }}
        shell: pwsh
        run: |
          Write-Host "No releasable inputs changed since ${{ steps.plan.outputs.base_tag }}."

      - name: Push beta tag and dispatch release
        if: ${{ steps.plan.outputs.has_changes == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.plan.outputs.next_tag }}
          VERSION: ${{ steps.plan.outputs.version }}
          REASON: ${{ steps.plan.outputs.reason }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw "GITHUB_TOKEN is required to push the beta tag and dispatch release.yml."
          }
          if ([string]::IsNullOrWhiteSpace($env:TAG_NAME) -or [string]::IsNullOrWhiteSpace($env:VERSION)) {
            throw "Planner did not return a beta tag and version."
          }

          git rev-parse --verify --quiet "refs/tags/$env:TAG_NAME"
          if ($LASTEXITCODE -eq 0) {
            throw "Tag $env:TAG_NAME already exists."
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a $env:TAG_NAME -m "Parsec CouchLink nightly prerelease $env:TAG_NAME"
          if ($LASTEXITCODE -ne 0) { throw "Could not create beta tag $env:TAG_NAME" }

          $remote = "https://x-access-token:$env:GH_TOKEN@github.com/${{ github.repository }}.git"
          git push $remote "refs/tags/$env:TAG_NAME"
          if ($LASTEXITCODE -ne 0) { throw "Could not push beta tag $env:TAG_NAME" }

          gh workflow run release.yml --ref main --field "version=$env:VERSION"
          if ($LASTEXITCODE -ne 0) { throw "Could not dispatch release.yml for $env:VERSION" }

          Write-Host "Pushed $env:TAG_NAME and dispatched release.yml for $env:VERSION."
          Write-Host "Reason: $env:REASON"
