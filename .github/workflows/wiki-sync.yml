name: Sync wiki

on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - '.github/workflows/wiki-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'RealWhyKnot/ParsecCouchLink'
    uses: RealWhyKnot/workflows/.github/workflows/wiki-sync.yml@v1
