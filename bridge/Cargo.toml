[package]
name = "parsec-couchlink"
version = "0.1.0"
edition = "2021"
description = "Windows host-side bridge between Parsec virtual gamepads and a Pico 2 W controller adapter."
license = "GPL-3.0-or-later"
repository = "https://github.com/RealWhyKnot/ParsecCouchLink"

[[bin]]
name = "couchlink"
path = "src/main.rs"

[dependencies]
# runtime engine
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# CLI + interactive UX
clap = { version = "4", features = ["derive"] }
dialoguer = { version = "0.11", features = ["password"] }
console = "0.15"
indicatif = "0.17"

# Cross-cutting / formats
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
zeroize = { version = "1", features = ["derive"] }
crc = "3"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

# Filesystem / OS paths
directories = "5"

# Support bundles
zip = { version = "2", default-features = false, features = ["deflate"] }

# Setup-mode USB-CDC enumeration (blocking; only used in setup/configure-wifi)
serialport = "4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Input_XboxController",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_Storage_FileSystem",
] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
